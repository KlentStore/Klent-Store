<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klent Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<h1>Klent Store</h1>
<p>خدمات Genshin Impact الاحترافية</p>
<a href="#services" class="btn">اطلب الآن</a>
</header>

<section id="services">
<h2>الخدمات</h2>
<div class="grid">
<div class="card">تطوير الشخصيات</div>
<div class="card">تفريم الوشات والمواد</div>
<div class="card">تجميع البيلد</div>
<div class="card">تختيم الأبِس</div>
<div class="card">تمكيس الأبراج</div>
<div class="card">تفريم المناطق</div>
</div>
</section>

<section>
<h2>مميزاتنا</h2>
<ul>
<li>تنفيذ سريع</li>
<li>أمان الحساب</li>
<li>دعم متواصل</li>
<li>أسعار مناسبة</li>
</ul>
</section>

<section>
<h2>طلب خدمة</h2>
<form id="orderForm">
<input type="text" placeholder="UID" required>
<input type="text" placeholder="السيرفر" required>
<input type="text" placeholder="الخدمة المطلوبة" required>
<textarea placeholder="ملاحظات"></textarea>
<button type="submit">إرسال</button>
</form>
</section>

<script src="script.js"></script>
</body>
</html>
